<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-bit Подземелье: Испытание Воли (Modular)</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #111;
            --border-color: #fff;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }
        
        body {
            margin: 0; padding: 20px 0; 
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 100%);
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', 'Consolas', monospace; 
            overflow-x: hidden;
            overflow-y: auto;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            user-select: none;
        }
        
        #gameWrapper { 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
            align-items: center;
            transform-origin: center center;
            padding: 20px;
        }
        
        #gameContainer {
            position: relative;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        #gameCanvas {
            background-color: #000; 
            border: 3px solid var(--border-color);
            box-shadow: 
                0 0 30px var(--accent-glow),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .crt::before {
            content: " "; 
            display: block; 
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10; 
            background-size: 100% 3px, 4px 100%; 
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 11;
            pointer-events: none;
        }
        
        #sidePanel {
            width: 280px; 
            min-height: 720px; 
            border: 2px solid var(--border-color); 
            background: linear-gradient(180deg, var(--panel-bg) 0%, #0a0a0a 100%);
            box-sizing: border-box; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #nodeInfo { flex-grow: 1; display: none; }
        #nodeInfo h2 { margin-top: 0; font-size: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        #nodeInfo p { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
        #niStatus { margin-top: 20px; font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .blink { animation: blink 1s step-end infinite; color: var(--text-primary); }
        @keyframes blink { 50% { opacity: 0; } }
        #guiContainer { margin-top: auto; }
        
        #hudPanel {
            width: 100%;
            max-width: 1040px;
            border: 2px solid var(--border-color);
            background: linear-gradient(180deg, var(--panel-bg) 0%, #0a0a0a 100%);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        
        .hud-section { display: flex; align-items: center; gap: 20px; }
        .hud-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2px;
        }
        .hud-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { font-size: 18px; font-weight: bold; color: var(--text-primary); text-shadow: 0 0 5px rgba(255, 255, 255, 0.3); }
        .health-bar { display: flex; gap: 4px; }
        .heart-icon {
            width: 20px; height: 20px;
            background: var(--border-color);
            clip-path: path('M10 18.35l-1.45-1.32C3.4 12.36 0 9.28 0 5.5 0 2.42 2.42 0 5.5 0 7.24 0 8.91.81 10 2.09 11.09.81 12.76 0 14.5 0 17.58 0 20 2.42 20 5.5c0 3.78-3.4 6.86-8.55 11.54L10 18.35z');
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.5));
        }
        .heart-icon.empty { 
            background: #333; 
            filter: none;
            transform: scale(0.9);
        }
        .heart-icon:not(.empty) { 
            animation: heartbeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 100, 100, 0.8));
        }
        @keyframes heartbeat { 
            0%, 100% { transform: scale(1); } 
            10%, 30% { transform: scale(1.15); } 
            20%, 40% { transform: scale(1); }
        }
        
        .hud-value.reloading { color: #f55; animation: pulse 0.5s ease-in-out infinite; }
        .hud-value.ready { color: #5f5; text-shadow: 0 0 8px rgba(100, 255, 100, 0.6); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .lil-gui { 
            --background-color: #000; --text-color: var(--text-primary); --title-background-color: #222;
            --widget-color: #333; --hover-color: #555; --focus-color: var(--border-color);
            --number-color: var(--text-primary); --string-color: var(--text-primary);
            --font-family: 'IBM Plex Mono', 'Consolas', monospace;
            border: 1px solid rgba(255, 255, 255, 0.3); position: static !important; width: 100% !important;
        }
        .lil-gui .title { background: var(--title-background-color); padding: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .hud-item { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="crt">
    <div id="gameWrapper">
        <div id="gameContainer" style="position: relative;">
            <canvas id="gameCanvas" width="960" height="720"></canvas>
            <div id="uiContainer" style="position: absolute; top: 0; left: 0; width: 960; height: 720; pointer-events: none; z-index: 5;"></div>
            <div id="debugPanel" style="position: absolute; bottom: 10px; right: 10px; z-index: 100;">
                <button id="godModeBtn" style="background: #000; color: #fff; border: 1px solid #fff; padding: 5px 10px; font-family: 'IBM Plex Mono'; cursor: pointer;">GOD MODE: OFF</button>
            </div>
        </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
